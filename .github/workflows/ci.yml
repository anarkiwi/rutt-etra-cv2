name: CI

"on": [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          grep -v '^opencv-python$' requirements.txt > requirements-headless.txt
          pip install opencv-python-headless -r requirements-headless.txt -r requirements-dev.txt
      - run: black --check .
      - run: pylint ruttetra tests tools

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target test -t ruttetra-test .
      - run: docker run --rm ruttetra-test
